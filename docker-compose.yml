version: '3'
services:
  #Processamento
  spark-iceberg:
    build:
      context: ./spark
    image: custom/spark-iceberg
    container_name: spark-iceberg
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092 # Essencial para o Spark se conectar ao Kafka
    ports:
      - 8888:8888
      - 8080:8080
      - 10000:10000
      - 10001:10001
  rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000

  # Storage
  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    volumes:
      - minio_data:/data
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: mc
    volumes:
      - ./base/configs/minio:/etc/minio-policies
    environment:
      - AWS_ACCESS_KEY_ID=minio_root
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: |
      /bin/sh -c "
      # 1. Crie um alias 'minio' com as credenciais do usuário root do MinIO
      until (/usr/bin/mc alias set minio http://minio:9000 minio password) do echo '...waiting for MinIO with root credentials...' && sleep 1; done;

      # 2. Remova e recrie o bucket 'warehouse' usando o alias root
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse;

      # 3. CRIE O USUÁRIO 'admin' SE ELE NÃO EXISTIR
      # Esta linha tentará primeiro habilitar o usuário (se já existir e estiver desabilitado)
      # Se falhar (usuário não existe ou outro erro), ele tentará ADICIONAR o usuário.
      echo 'Ensuring admin user exists and is enabled...'
      /usr/bin/mc admin user add minio admin password;

      # 4. Crie a política usando o alias 'minio_root'
      /usr/bin/mc admin policy create minio full-access-warehouse /etc/minio-policies/minio_policy_full_access_warehouse.json;

      # 5. Anexe esta política ao usuário 'admin'
      /usr/bin/mc admin policy attach minio full-access-warehouse --user admin;

      # Mantenha o contêiner rodando
      tail -f /dev/null
      "
    networks:
      iceberg_net:

  #Banco de Dados Relacional para Metadados e Ferramentas
  postgresql:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  # Orquestração e Agendamento
  mage:
    image: mageai/mageai:latest
    container_name: mage
    restart: always
    ports:
      - 6789:6789
    volumes:
      - ./mage_workspace:/home/src
    environment:
      # Credenciais para acessar o MinIO como Data Lake
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_S3_BUCKET: "datalake"
      # Configurações do banco de dados (usando o PostgreSQL desta stack)
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_HOST: postgresql
    depends_on:
      - minio
      - postgresql

