  # Kafka
  kafka:
    image: wurstmeister/kafka:2.12-2.5.0
    container_name: kafka
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OPTS: >
        -javaagent:/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/jmx_exporter/kafka-jmx-config.yaml
    ports:
      - "9092:9092" # Porta do Kafka
      - "7071:7071" # JMX Exporter port
    volumes:
      - ./base/configs/jmx_exporter:/jmx_exporter
    depends_on:
      - zookeeper
    networks:
      - iceberg_net

  # Zookeeper (Kafka dependency)
  zookeeper:
    image: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181" # Zookeeper client port
    networks:
      - iceberg_net

  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: kafka-exporter
    environment:
      - KAFKA_SERVER=kafka:9092 # Endereço do broker Kafka
      - KAFKA_EXPORTER_LOG_LEVEL=info
      - KAFKA_EXPORTER_GROUP_FILTER=.*
      - KAFKA_EXPORTER_TOPIC_FILTER=.*
      - KAFKA_EXPORTER_RETRY_BACKOFF="500ms"
      - KAFKA_EXPORTER_RETRY_MAX_BACKOFF="30s"
    ports:
      - "9308:9308" # Porta para expor métricas do Kafka Exporter
    depends_on:
      - kafka
    networks:
      - iceberg_net
    volumes:
      - ./base/configs/wait-for-kafka-sh.sh:/wait-for-kafka.sh
    entrypoint: [ "/bin/sh", "/wait-for-kafka.sh", "kafka_exporter" ]

  # Produtor Kafka para que gera os dados da API de
  api_fake:
    build:
      dockerfile: api_fake/Dockerfile-api-fake
    container_name: api_fake
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    command: ["/app/wait-for-kafka.sh", "kafka", "python", "/app/main.py" ]
    networks:
      - iceberg_net

  spark-instagram-kafka-to-bronze:
    build:
      dockerfile: instagram_ingestion/Dockerfile-ingestion
    container_name: instagram_ingestion
    environment:
      - SPARK_MASTER=spark://spark-iceberg:7077
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=instagram-post
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - "4040:4040"
    volumes:
      - ./base/configs/metrics:/etc/metrics
    depends_on:
