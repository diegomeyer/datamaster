global:
  scrape_interval: 5s

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ['kafka:7071']

  - job_name: kafka-exporter
    static_configs:
      - targets: [ 'kafka-exporter:9308' ]

    # O Prometheus também pode ser um alvo para monitoramento próprio
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster # Este é o endpoint correto
    scheme: http
    static_configs:
      - targets: [ 'minio:9000' ] # O nome do serviço e a porta da API